<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Checkers</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #1a1a2e;
    --bg-elev-1: #20203a;
    --bg-elev-2: #262644;
    --bg-elev-3: #2e2e50;
    --line: #2f2f52;
    --line-soft: #252544;
    --text: #ececf5;
    --text-mute: #9595b5;
    --text-dim: #6a6a8a;
    --accent: oklch(0.78 0.11 75);
    --accent-soft: oklch(0.78 0.11 75 / 0.14);
    --player: #e8dcc4;
    --player-dark: #b9a37e;
    --opp: #b8434a;
    --opp-dark: #7d262d;
    --board-light: #3a3a5c;
    --board-dark: #1f1f38;
    --good: oklch(0.74 0.13 155);
    --warn: oklch(0.72 0.16 30);
    --radius: 14px;
    --mono: "JetBrains Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: "Manrope", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  body { min-height: 100vh; overflow-x: hidden; }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  ::selection { background: var(--accent-soft); }

  /* page transitions */
  .page { animation: fade 280ms ease both; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="login.jsx"></script>
<script type="text/babel" src="dashboard.jsx"></script>
<script type="text/babel" src="game.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
</body>
</html>
